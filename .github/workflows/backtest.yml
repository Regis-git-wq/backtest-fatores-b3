name: Rodar backtest

# Roda sempre que o código muda, ou manualmente pela aba "Actions"
# do GitHub (botão "Run workflow"). O período é fixo em config.py,
# então os resultados só mudam quando o código ou os parâmetros mudam.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "config.py", "main.py", "tests/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes de sanidade
        run: python -m tests.test_pipeline
      - name: Backtest com dados reais
        run: python main.py
      - name: Salvar resultados no repositório
        run: |
          cp results/*.csv results/*.png resultados/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "Atualiza resultados do backtest [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: results/

name: Rodar backtest

# Roda sozinho no dia 2 de cada mês, sempre que o código muda,
# ou manualmente pela aba "Actions" do GitHub (botão "Run workflow").
on:
  schedule:
    - cron: "17 12 2 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "config.py", "main.py", "tests/**", "requirements.txt"]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes de sanidade
        run: python -m tests.test_pipeline
      - name: Backtest com dados reais
        run: python main.py
      - name: Salvar planilha no repositório
        run: |
          cp results/resultados_backtest.xlsx resultados/
          cp results/metricas.csv results/regressoes_alfa.csv resultados/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "Atualiza resultados do backtest [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: results/
